name: Cloud APK Compiler
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Java Runtime
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Android Build Tools
        run: |
          mkdir -p ~/android-sdk/build-tools
          cd ~/android-sdk/build-tools
          wget https://dl.google.com/android/repository/build-tools_r34.0.0-linux.zip
          unzip -q build-tools_r34.0.0-linux.zip
          mv android-14 aapt2-build
          chmod +x aapt2-build/aapt2

      - name: Build RRO APK
        run: |
          mkdir -p build
          AAPT2=~/android-sdk/build-tools/aapt2-build/aapt2
          
          # Compile resources
          $AAPT2 compile -o build/compiled.flata res/layout/status_bar_mobile_signal_group_inner.xml
          $AAPT2 compile -o build/compiled.flatb res/values/public.xml
          
          # Link into APK
          $AAPT2 link \
            --package-id 0x7f \
            -o HideDataIcon.apk \
            --manifest AndroidManifest.xml \
            build/compiled.flata build/compiled.flatb

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-overlay-apk
          path: HideDataIcon.apk
