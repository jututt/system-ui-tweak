name: Cloud APK Compiler
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Build RRO APK
        run: |
          mkdir -p build
          AAPT2=$ANDROID_HOME/build-tools/34.0.0/aapt2
          ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar
          
          # 1. Compile the resource directory completely
          $AAPT2 compile --dir res/ -o build/compiled_res.flata
          
          # 2. Link into APK with specific flags for private system packages
          $AAPT2 link \
            -I "$ANDROID_JAR" \
            --allow-reserved-package-id \
            --custom-package com.android.systemui \
            --package-id 0x7f \
            -o HideDataIcon.apk \
            --manifest AndroidManifest.xml \
            build/compiled_res.flata

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-overlay-apk
          path: HideDataIcon.apk
