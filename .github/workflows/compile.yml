name: Cloud APK Compiler
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Platform Base
        run: |
          # Automatically downloads the official android.jar platform dependency required to link System XMLs
          mkdir -p ~/android-sdk/platforms/android-34
          wget -q https://github.com -O ~/android-sdk/platforms/android-34/android.jar || \
          curl -s https://googlesource.com | base64 --decode > ~/android-sdk/platforms/android-34/android.jar

      - name: Download Android Build Tools
        run: |
          mkdir -p ~/android-sdk/build-tools
          cd ~/android-sdk/build-tools
          wget -q https://dl.google.com/android/repository/build-tools_r34.0.0-linux.zip
          unzip -q build-tools_r34.0.0-linux.zip
          mv android-14 aapt2-build
          chmod +x aapt2-build/aapt2

      - name: Build RRO APK
        run: |
          mkdir -p build
          AAPT2=~/android-sdk/build-tools/aapt2-build/aapt2
          ANDROID_JAR=~/android-sdk/platforms/android-34/android.jar
          
          # 1. Compile the layout configuration (Pass the directory to pull overlays.xml too if it lives in res/xml/)
          $AAPT2 compile --dir res/ -o build/compiled_res.flata
          
          # 2. Link into APK using the framework map dependency
          $AAPT2 link \
            -I "$ANDROID_JAR" \
            --package-id 0x7f \
            -o HideDataIcon.apk \
            --manifest AndroidManifest.xml \
            build/compiled_res.flata

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-overlay-apk
          path: HideDataIcon.apk
