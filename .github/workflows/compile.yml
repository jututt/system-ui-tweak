name: Cloud APK Compiler
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Java Runtime
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build RRO APK
        run: |
          mkdir -p build
          
          # Use aapt2 from installed build-tools
          AAPT2=$(find /usr/lib/android-sdk/build-tools -name "aapt2" | head -1)
          
          if [ -z "$AAPT2" ]; then
            # Fallback: try common location
            AAPT2="/usr/bin/aapt2"
          fi
          
          echo "Using aapt2: $AAPT2"
          
          # Compile resources
          $AAPT2 compile -o build/compiled.flata res/layout/status_bar_mobile_signal_group_inner.xml
          $AAPT2 compile -o build/compiled.flatb res/values/public.xml
          
          # Link into APK
          $AAPT2 link \
            --package-id 0x7f \
            -o HideDataIcon.apk \
            --manifest AndroidManifest.xml \
            build/compiled.flata build/compiled.flatb

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-overlay-apk
          path: HideDataIcon.apk
