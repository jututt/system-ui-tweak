name: Cloud APK Compiler
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Java Runtime
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-build-tools android-sdk

      - name: Find Android Platform JAR
        run: |
          ANDROID_JAR=$(find /usr/lib/android-sdk/platforms -name "android.jar" | sort -V | tail -1)
          echo "ANDROID_JAR=$ANDROID_JAR" >> $GITHUB_ENV
          echo "Using Android JAR: $ANDROID_JAR"

      - name: Compile RRO APK with aapt2
        run: |
          mkdir -p compiled
          aapt2 compile -o compiled/resources.zip res/layout/status_bar_mobile_signal_group_inner.xml res/values/public.xml
          aapt2 link \
            -o HideDataIcon.apk \
            --manifest AndroidManifest.xml \
            -I "$ANDROID_JAR" \
            compiled/resources.zip

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-overlay-apk
          path: HideDataIcon.apk
