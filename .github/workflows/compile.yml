name: Cloud APK Compiler
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Automatically installs the official SDK, Build Tools (aapt2), and Android Platform 34 cleanly
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Build RRO APK
        run: |
          mkdir -p build
          
          # Using the official paths provided automatically by the setup-android action
          AAPT2=$ANDROID_HOME/build-tools/34.0.0/aapt2
          ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar
          
          # 1. Compile the resource directory completely
          $AAPT2 compile --dir res/ -o build/compiled_res.flata
          
          # 2. Link into APK with specific flags for private system packages
          $AAPT2 link \
            -I "$ANDROID_JAR" \
            --allow-reserved-package-id \
            --custom-package com.android.systemui \
            --package-id 0x7f \
            -o HideDataIcon.apk \
            --manifest AndroidManifest.xml \
            build/compiled_res.flata

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-overlay-apk
          path: HideDataIcon.apk
