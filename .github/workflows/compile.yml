name: Cloud APK Compiler
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Java Runtime
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Compile RRO APK with aapt2
        run: |
          mkdir -p compiled
          
          # Use the system framework
          ANDROID_HOME=${ANDROID_HOME:-$HOME/android-sdk}
          FRAMEWORK_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          
          if [ ! -f "$FRAMEWORK_JAR" ]; then
            # Fallback: try to find any available platform
            FRAMEWORK_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" 2>/dev/null | head -1)
          fi
          
          if [ -z "$FRAMEWORK_JAR" ]; then
            echo "Warning: No android.jar found, building without framework"
            FRAMEWORK_FLAG=""
          else
            echo "Using framework: $FRAMEWORK_JAR"
            FRAMEWORK_FLAG="-I $FRAMEWORK_JAR"
          fi
          
          aapt2 compile -o compiled/resources.zip res/layout/status_bar_mobile_signal_group_inner.xml res/values/public.xml
          aapt2 link \
            -o HideDataIcon.apk \
            --manifest AndroidManifest.xml \
            $FRAMEWORK_FLAG \
            compiled/resources.zip

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-overlay-apk
          path: HideDataIcon.apk
