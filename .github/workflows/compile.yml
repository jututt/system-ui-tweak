name: Cloud APK Compiler
on: 
  workflow_dispatch: # Gives you a manual button to build the app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Java Runtime
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Source via REAndroid
        run: |
          java -jar APKEditor-1.4.9 b -i . -o HideDataIcon.apk

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-overlay-apk
          path: HideDataIcon.apk
